name: Build ZenithX Client

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Client JAR
        run: ./gradlew build

      - name: Upload Compiled Client JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZenithX-Client-JAR
          path: build/libs/zenithx-*.jar
